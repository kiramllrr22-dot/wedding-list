<!doctype html>
<html lang="fr">
<head>
<title>Bienvenue</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Pinyon+Script&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="site-head" id="site-head"></header>

<main>
  <section class="hero-full" id="hero">
    <div class="hero-inner">
      <p class="hero-tag" data-t="hero_tag"></p>
      <h1 class="hero-names" id="hero-names"></h1>
      <p class="hero-date" id="hero-date"></p>
      <p class="hero-place" id="hero-place"></p>
      <div class="countdown" id="countdown" hidden></div>
    </div>
    <a class="scroll-cue" href="#suite"><span data-t="discover"></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
  </section>

  <div id="suite">
    <section class="intro-block wrap" id="intro-block" hidden><p id="intro"></p></section>

    <section class="story wrap" id="histoire" hidden>
      <h2 class="section-title"><span data-t="story_a"></span> <span class="script" data-t="story_b"></span></h2>
      <div id="chapters"></div>
    </section>

    <nav class="next wrap" id="next" aria-label="Pages"></nav>
    <p class="status" id="status" hidden></p>
  </div>
</main>

<footer class="foot wrap" id="site-foot"></footer>

<script>
(async function () {
  const S = window.Site, { t, tr, el } = S;
  const s = await S.init("home");
  if (!s) return;

  const img = S.safeUrl(s.hero_image);
  if (img) document.getElementById("hero").style.backgroundImage = "url(\"" + img.replace(/"/g, "%22") + "\")";
  document.getElementById("hero-names").replaceChildren(S.namesNode(s.names));
  const d = S.parseDate(s.event_date);
  document.getElementById("hero-date").textContent = S.fmtDots(d);
  document.getElementById("hero-place").textContent = s.place || "";

  const n = S.daysUntil(d);
  if (n != null) {
    const cd = document.getElementById("countdown");
    cd.textContent = n > 1 ? t("cd_days", { n }) : n === 1 ? t("cd_tomorrow") : n === 0 ? t("cd_today") : t("cd_past");
    cd.hidden = false;
  }

  const intro = tr(s, "intro");
  if (intro) { document.getElementById("intro").textContent = intro; document.getElementById("intro-block").hidden = false; }

  // Raccourcis vers les autres pages
  const next = document.getElementById("next");
  const card = (href, key) => next.append(el("a", { href }, el("strong", { text: t(key) }), el("span", { text: t("next_go") })));
  if (s.show_infos) card("infos.html", "next_infos");
  if (S.rsvpOpen(s)) card("rsvp.html", "next_rsvp");
  if (s.show_list) card("liste.html", "next_list");

  if (!s.show_story) return;
  const { data: chapters, error } = await S.db.from("story").select("*").order("position").order("created_at");
  if (error || !chapters || !chapters.length) return;
  const box = document.getElementById("chapters");
  chapters.forEach((c) => {
    const pic = S.safeUrl(c.image_url);
    const art = el("article", { class: "chapter" + (pic ? "" : " no-photo") });
    if (pic) art.append(el("div", { class: "ph" }, el("img", { src: pic, alt: "", loading: "lazy" })));
    const txt = el("div", { class: "txt" });
    const label = tr(c, "label"), text = tr(c, "text");
    if (label) txt.append(el("span", { class: "pill", text: label }));
    if (text) txt.append(el("p", { text }));
    art.append(txt); box.append(art); S.reveal(art);
  });
  document.getElementById("histoire").hidden = false;
})();
</script>
</body>
</html>
